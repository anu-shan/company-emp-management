
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeopleHub | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">PeopleHub</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="employees.html">Employees</a>
            <a class="active" href="contact.html">Contact</a>
        </div>
    </nav>

    <main>
        <section class="page-banner">
            <h1>Get In Touch</h1>
            <p>We would love to hear from you.</p>
        </section>

        <section class="contact-section">
            <div class="contact-info">
                <h2>Let's Connect</h2>
                <p>Have a question or want to know more about PeopleHub?</p>

                <div class="contact-detail">
                    <strong>Email</strong>
                    <p>hello@peoplehub.example</p>
                </div>

                <div class="contact-detail">
                    <strong>Phone</strong>
                    <p>+64 21 000 0000</p>
                </div>

                <div class="contact-detail">
                    <strong>Location</strong>
                    <p>Auckland, New Zealand</p>
                </div>
            </div>

            <form class="contact-form" id="contactForm">
                <h2>Send a Message</h2>

                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>

                <label for="email">Your Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>

                <label for="message">Your Message</label>
                <textarea id="message" rows="5" placeholder="Write your message..." required></textarea>

                <button type="submit" class="btn">Send Message</button>
                <p id="formMessage" class="form-message" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 PeopleHub. All rights reserved.</p>
    </footer>

</body>
</html>
